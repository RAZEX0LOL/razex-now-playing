services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: nowave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nowave
    volumes:
      - nowave-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowave"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nowave:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/nowave
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  nowave-db:
